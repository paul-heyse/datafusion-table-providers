[workspace]
members = ["core", "crates/common", "python", "crates/odbc", "crates/clickhouse", "crates/flightsql", "crates/mongodb", "crates/mysql", "crates/sqlite", "crates/postgres", "crates/duckdb", "crates/adbc", "crates/oracle"]
resolver = "2"

[workspace.package]
version = "0.13.1"
readme = "README.md"
edition = "2021"
repository = "https://github.com/datafusion-contrib/datafusion-table-providers"
license = "Apache-2.0"
description = "Extend the capabilities of DataFusion to support additional data sources via implementations of the `TableProvider` trait."

[workspace.dependencies]
arrow = "59.0"
arrow-array = { version = "59.0" }
arrow-flight = { version = "59.0", features = [
    "flight-sql-experimental",
    "tls-ring",
] }
arrow-ipc = { version = "59.0" }
arrow-schema = { version = "59.0", features = ["serde"] }
arrow-json = "59.0"
arrow-odbc = { version = "25.3" }
datafusion = { version = "55.0", default-features = false }
datafusion-expr = { version = "55.0" }
datafusion-federation = { version = "0.5.6" }
datafusion-ffi = { version = "55.0" }
datafusion-proto = { version = "55.0" }
datafusion-physical-expr = { version = "55.0" }
datafusion-physical-plan = { version = "55.0" }
datafusion-python = { git = "https://github.com/apache/datafusion-python", branch = "main"}
datafusion-table-providers = { version = "0.13.1", path = "core" }
datafusion-table-providers-common = { version = "0.13.1", path = "crates/common", default-features = false }
datafusion-table-providers-odbc = { version = "0.13.1", path = "crates/odbc" }
datafusion-table-providers-clickhouse = { version = "0.13.1", path = "crates/clickhouse" }
datafusion-table-providers-flightsql = { version = "0.13.1", path = "crates/flightsql" }
datafusion-table-providers-mongodb = { version = "0.13.1", path = "crates/mongodb" }
datafusion-table-providers-mysql = { version = "0.13.1", path = "crates/mysql" }
datafusion-table-providers-sqlite = { version = "0.13.1", path = "crates/sqlite" }
datafusion-table-providers-postgres = { version = "0.13.1", path = "crates/postgres" }
datafusion-table-providers-duckdb = { version = "0.13.1", path = "crates/duckdb" }
datafusion-table-providers-adbc = { version = "0.13.1", path = "crates/adbc" }
datafusion-table-providers-oracle = { version = "0.13.1", path = "crates/oracle" }
duckdb = { git = "https://github.com/duckdb/duckdb-rs", branch = "main"}
adbc_core = { version = "0.24" }
adbc_driver_manager = { version = "0.24" }
